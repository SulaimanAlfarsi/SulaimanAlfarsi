name: Update Recent Activity

on:
  schedule:
    - cron: "0 */4 * * *"   # every 4 hours
  workflow_dispatch:        # lets you run it manually from the Actions tab
  push:                     # re-run whenever this workflow itself changes
    branches: [main]
    paths: [".github/workflows/activity.yml"]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build activity list from GitHub events
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: SulaimanAlfarsi
        run: |
          python3 - <<'PY'
          import json, os, re, sys, urllib.request
          from datetime import datetime, timezone

          user = os.environ["GH_USER"]
          req = urllib.request.Request(
              f"https://api.github.com/users/{user}/events/public?per_page=100",
              headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                       "Accept": "application/vnd.github+json"})
          events = json.load(urllib.request.urlopen(req))

          def link(repo):
              return f"[{repo}](https://github.com/{repo})"

          def ago(ts):
              d = datetime.now(timezone.utc) - datetime.fromisoformat(ts.replace("Z", "+00:00"))
              h = int(d.total_seconds() // 3600)
              if h < 1: return "just now"
              if h < 24: return f"{h}h ago"
              return f"{h // 24}d ago"

          # The events API no longer returns html_url on nested objects,
          # so build every link from the repo name + number ourselves.
          def ref_link(repo, kind, number):
              return f"[#{number}](https://github.com/{repo}/{kind}/{number})"

          lines, seen = [], set()
          for e in events:
              repo = e["repo"]["name"]
              if repo.lower() == f"{user}/{user}".lower():
                  continue  # skip the profile repo itself (bot commits)
              t, p = e["type"], e.get("payload", {})
              msg = None
              if t == "PushEvent":
                  # payload.size / payload.commits were removed from this API,
                  # so report the branch instead of a commit count.
                  branch = (p.get("ref") or "").replace("refs/heads/", "")
                  key = ("push", repo, branch)
                  if key in seen: continue
                  seen.add(key)
                  where = f"`{branch}` on {link(repo)}" if branch else link(repo)
                  msg = f"⬆️ Pushed to {where}"
              elif t == "CreateEvent" and p.get("ref_type") == "repository":
                  msg = f"🆕 Created repository {link(repo)}"
              elif t == "PullRequestEvent":
                  pr = p.get("pull_request") or {}
                  n = p.get("number") or pr.get("number")
                  action = p.get("action", "")
                  if action == "closed" and (pr.get("merged") or pr.get("merged_at")):
                      action = "merged"
                  msg = f"🔀 {action.capitalize()} PR {ref_link(repo, 'pull', n)} in {link(repo)}"
              elif t == "PullRequestReviewEvent":
                  pr = p.get("pull_request") or {}
                  n = pr.get("number") or p.get("number")
                  key = ("review", repo, n)
                  if key in seen: continue
                  seen.add(key)
                  msg = f"🔍 Reviewed PR {ref_link(repo, 'pull', n)} in {link(repo)}"
              elif t == "IssuesEvent":
                  i = p.get("issue") or {}
                  n = i.get("number") or p.get("number")
                  msg = f"🐛 {p.get('action','').capitalize()} issue {ref_link(repo, 'issues', n)} in {link(repo)}"
              elif t == "ReleaseEvent":
                  r = p.get("release") or {}
                  tag = r.get("tag_name")
                  msg = f"🚀 Released [{tag}](https://github.com/{repo}/releases/tag/{tag}) in {link(repo)}"
              elif t == "WatchEvent":
                  msg = f"⭐ Starred {link(repo)}"
              elif t == "ForkEvent":
                  msg = f"🍴 Forked {link(repo)}"
              if msg:
                  lines.append(f"{len(lines)+1}. {msg} — <sub>{ago(e['created_at'])}</sub>")
              if len(lines) >= 8:
                  break

          body = "\n".join(lines) if lines else "_No recent public activity._"
          readme = open("README.md", encoding="utf-8").read()
          new, count = re.subn(r"(<!--START_SECTION:activity-->).*?(<!--END_SECTION:activity-->)",
                               lambda m: f"{m.group(1)}\n{body}\n{m.group(2)}", readme, flags=re.S)
          if count != 1:
              sys.exit(f"README.md: expected 1 activity marker pair, found {count}")
          open("README.md", "w", encoding="utf-8").write(new)
          print(body)
          PY

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || (git commit -m "chore: update recent activity" && git push)
