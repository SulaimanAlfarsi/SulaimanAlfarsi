name: Update Recent Activity

on:
  schedule:
    - cron: "0 */4 * * *"   # every 4 hours
  workflow_dispatch:        # lets you run it manually from the Actions tab
  push:                     # re-run whenever this workflow itself changes
    branches: [main]
    paths: [".github/workflows/activity.yml"]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build activity table from GitHub events
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: SulaimanAlfarsi
        run: |
          python3 - <<'PY'
          import json, os, re, sys, urllib.request
          from datetime import datetime, timezone

          user = os.environ["GH_USER"]
          req = urllib.request.Request(
              f"https://api.github.com/users/{user}/events/public?per_page=100",
              headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                       "Accept": "application/vnd.github+json"})
          events = json.load(urllib.request.urlopen(req))

          def short(repo):
              """Own repos show bare name; others keep the owner prefix."""
              owner, name = repo.split("/", 1)
              return name if owner.lower() == user.lower() else repo

          def when(ts):
              return datetime.fromisoformat(ts.replace("Z", "+00:00")).strftime("%b %d")

          rows, seen = [], set()
          for e in events:
              repo, t, p = e["repo"]["name"], e["type"], e.get("payload", {})
              if repo.lower() == f"{user}/{user}".lower():
                  continue  # skip the profile repo itself (bot commits)
              # The events API no longer returns html_url on nested objects,
              # so every link is built from the repo name + number instead.
              n = (p.get("pull_request") or {}).get("number") or p.get("number")
              base = f"https://github.com/{repo}"
              if t == "PushEvent":
                  # payload.size / payload.commits were removed from this API,
                  # so no commit count is available to show.
                  kind, icon, what, url = "push", "⬆️", "Pushed", base
              elif t == "PullRequestEvent":
                  action = p.get("action", "")
                  pr = p.get("pull_request") or {}
                  if action == "closed" and (pr.get("merged") or pr.get("merged_at")):
                      action = "merged"
                  kind, icon = ("pr", n), "🔀"
                  what, url = f"{action.capitalize()} PR #{n}", f"{base}/pull/{n}"
              elif t == "PullRequestReviewEvent":
                  kind, icon, what, url = ("review", n), "🔍", f"Reviewed PR #{n}", f"{base}/pull/{n}"
              elif t == "IssuesEvent":
                  i = p.get("issue") or {}
                  n = i.get("number") or n
                  kind, icon = ("issue", n), "🐛"
                  what, url = f"{p.get('action','').capitalize()} issue #{n}", f"{base}/issues/{n}"
              elif t == "ReleaseEvent":
                  tag = (p.get("release") or {}).get("tag_name")
                  kind, icon = ("release", tag), "🚀"
                  what, url = f"Released {tag}", f"{base}/releases/tag/{tag}"
              elif t == "CreateEvent" and p.get("ref_type") == "repository":
                  kind, icon, what, url = "new", "🆕", "Created repo", base
              elif t == "ForkEvent":
                  kind, icon, what, url = "fork", "🍴", "Forked", base
              else:
                  continue  # ignores stars and everything else not worth a row
              key = (kind, repo)
              if key in seen:
                  continue
              seen.add(key)
              rows.append(f"| {icon} | {what} | [`{short(repo)}`]({url}) | {when(e['created_at'])} |")
              if len(rows) >= 7:
                  break

          if rows:
              body = "\n".join(["| | Activity | Repository | When |",
                                "|:-:|---|---|--:|"] + rows)
          else:
              body = "_No recent public activity._"

          readme = open("README.md", encoding="utf-8").read()
          new, count = re.subn(r"(<!--START_SECTION:activity-->).*?(<!--END_SECTION:activity-->)",
                               lambda m: f"{m.group(1)}\n{body}\n{m.group(2)}", readme, flags=re.S)
          if count != 1:
              sys.exit(f"README.md: expected 1 activity marker pair, found {count}")
          open("README.md", "w", encoding="utf-8").write(new)
          print(body)
          PY

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || (git commit -m "chore: update recent activity" && git push)
