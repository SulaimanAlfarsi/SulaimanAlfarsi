<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#1E293B" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect width="1000" height="300" rx="16"/></clipPath>
    <style>
      .mono  { font-family: 'JetBrains Mono','Fira Code',Consolas,'Liberation Mono',Menlo,monospace; }
      .cmd   { font-size: 16px; fill: #64748B; }
      .ps    { fill: #2DD4BF; }
      .name  { font-size: 40px; font-weight: 700; fill: #F8FAFC; }
      .out   { font-size: 18px; fill: #CBD5E1; }
      .hl    { fill: #38BDF8; }
      .tag   { font-size: 12px; fill: #64748B; letter-spacing: 2px; }

      /* typing: a cover block slides right in steps, revealing text */
      .cover { fill: #0B1120; }
      .t1 { animation: type 0.9s steps(12) 0.3s forwards; }
      .t2 { animation: type 1.2s steps(18) 1.3s forwards; }
      .t3 { animation: type 0.9s steps(14) 2.6s forwards; }
      .t4 { animation: type 1.3s steps(30) 3.6s forwards; }
      .t5 { animation: type 0.8s steps(12) 5.0s forwards; }
      .t6 { animation: type 1.1s steps(24) 5.9s forwards; }
      @keyframes type { to { transform: translateX(620px); } }

      .cursor { fill: #2DD4BF; opacity: 0; animation: show 0s 7.1s forwards, blink 1s step-end 7.1s infinite; }
      @keyframes show  { to { opacity: 1; } }
      @keyframes blink { 50% { opacity: 0; } }

      /* network */
      .edge { stroke: #334155; stroke-width: 1.5; fill: none; }
      .flow { stroke: url(#accent); stroke-width: 2; fill: none; stroke-dasharray: 6 14; animation: flow 2.4s linear infinite; }
      .flow.slow { animation-duration: 3.6s; }
      @keyframes flow { to { stroke-dashoffset: -40; } }
      .node { fill: #0F172A; stroke: #38BDF8; stroke-width: 2; }
      .node.alt { stroke: #2DD4BF; }
      .core { fill: url(#accent); }
      .pulse { fill: none; stroke: #38BDF8; stroke-width: 2; transform-box: fill-box; transform-origin: center; animation: pulse 2.6s ease-out infinite; }
      .pulse.d2 { animation-delay: 1.3s; }
      @keyframes pulse { from { transform: scale(1); opacity: .8; } to { transform: scale(2.6); opacity: 0; } }
      .lbl { font-size: 11px; fill: #94A3B8; }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <!-- background -->
    <rect width="1000" height="300" fill="#0B1120"/>
    <rect width="1000" height="300" fill="url(#grid)" opacity="0.6"/>
    <circle cx="800" cy="150" r="190" fill="url(#glow)"/>

    <!-- window chrome -->
    <rect width="1000" height="36" fill="#111827"/>
    <circle cx="22" cy="18" r="6" fill="#F87171"/>
    <circle cx="42" cy="18" r="6" fill="#FBBF24"/>
    <circle cx="62" cy="18" r="6" fill="#34D399"/>
    <text x="500" y="23" text-anchor="middle" class="mono tag">SULAIMAN@MUSCAT: ~/PROFILE</text>
    <rect y="36" width="1000" height="1" fill="#1E293B"/>

    <!-- terminal lines -->
    <g class="mono">
      <text x="40" y="80" class="cmd"><tspan class="ps">❯</tspan> whoami</text>
      <rect class="cover t1" x="54" y="64" width="620" height="22"/>

      <text x="40" y="126" class="name">Sulaiman Al-Farsi</text>
      <rect class="cover t2" x="36" y="92" width="620" height="44"/>

      <text x="40" y="166" class="cmd"><tspan class="ps">❯</tspan> cat role.txt</text>
      <rect class="cover t3" x="54" y="150" width="620" height="22"/>

      <text x="40" y="194" class="out">Backend Developer <tspan class="hl">·</tspan> AI &amp; Data <tspan class="hl">·</tspan> Spring Boot</text>
      <rect class="cover t4" x="36" y="176" width="620" height="26"/>

      <text x="40" y="232" class="cmd"><tspan class="ps">❯</tspan> echo $LOCATION</text>
      <rect class="cover t5" x="54" y="216" width="620" height="22"/>

      <text x="40" y="260" class="out">Muscat, Oman <tspan class="hl">🇴🇲</tspan>  — open to work</text>
      <rect class="cover t6" x="36" y="242" width="620" height="26"/>

      <rect class="cursor" x="40" y="272" width="10" height="3"/>
    </g>

    <!-- network graphic -->
    <g>
      <path class="edge" d="M800 150 L700 85"/>
      <path class="edge" d="M800 150 L905 90"/>
      <path class="edge" d="M800 150 L920 215"/>
      <path class="edge" d="M800 150 L690 225"/>
      <path class="edge" d="M700 85 L905 90"/>
      <path class="edge" d="M690 225 L920 215"/>

      <path class="flow" d="M700 85 L800 150"/>
      <path class="flow slow" d="M905 90 L800 150"/>
      <path class="flow" d="M800 150 L920 215"/>
      <path class="flow slow" d="M800 150 L690 225"/>

      <circle class="pulse" cx="800" cy="150" r="18"/>
      <circle class="pulse d2" cx="800" cy="150" r="18"/>
      <circle class="core" cx="800" cy="150" r="18"/>
      <text x="800" y="155" text-anchor="middle" class="mono" style="font-size:13px;font-weight:700;fill:#0B1120">API</text>

      <circle class="node" cx="700" cy="85" r="10"/>
      <circle class="node alt" cx="905" cy="90" r="10"/>
      <circle class="node alt" cx="690" cy="225" r="10"/>
      <circle class="node" cx="920" cy="215" r="10"/>

      <text x="700" y="64" text-anchor="middle" class="mono lbl">client</text>
      <text x="905" y="69" text-anchor="middle" class="mono lbl">ai</text>
      <text x="690" y="252" text-anchor="middle" class="mono lbl">db</text>
      <text x="920" y="242" text-anchor="middle" class="mono lbl">data</text>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="999" height="299" rx="16" fill="none" stroke="#1E293B"/>
</svg>
