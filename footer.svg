<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="44" viewBox="0 0 1000 44">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
    <style>
      .mono { font-family: 'JetBrains Mono','Fira Code',Consolas,'Liberation Mono',Menlo,monospace; font-size: 13px; }
      .dim  { fill: #94A3B8; }
      .hi   { fill: #E2E8F0; }
      .dot  { fill: #34D399; animation: blink 1.6s ease-in-out infinite; }
      @keyframes blink { 50% { opacity: .25; } }
      .bar  { animation: slide 4s ease-in-out infinite alternate; }
      @keyframes slide { from { transform: translateX(0); } to { transform: translateX(840px); } }
    </style>
    <clipPath id="c"><rect width="1000" height="44" rx="10"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="1000" height="44" fill="#0B1120"/>
    <rect class="bar" x="0" y="0" width="160" height="2" fill="url(#accent)"/>
    <circle class="dot" cx="24" cy="23" r="5"/>
    <text x="38" y="27" class="mono hi">online</text>
    <text x="110" y="27" class="mono dim">│  ⎇ main  │  built with ☕ in Oman</text>
    <text x="976" y="27" text-anchor="end" class="mono dim">thanks for visiting <tspan fill="#2DD4BF">❯_</tspan></text>
  </g>
  <rect x="0.5" y="0.5" width="999" height="43" rx="10" fill="none" stroke="#1E293B"/>
</svg>
